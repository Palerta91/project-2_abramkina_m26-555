[project]
name = "project-2-abramkina-m26-555"
version = "0.1.0"
description = "Учебный проект: примитивная база данных на Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Melanie Abramkina" }]
dependencies = [
    "prettytable>=3.12,<4",
    "prompt-toolkit>=3.0,<4",
]

[project.scripts]
database = "primitive_db.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primitive_db"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
